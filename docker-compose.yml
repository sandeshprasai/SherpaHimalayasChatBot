version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    # --- ADDED HEALTHCHECK FOR REDIS ---
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatbot:latest
    env_file: .env
    volumes:
      - chatbot_data:/app/data
      - ./data/datasets/rag_ready:/app/data/datasets/rag_ready:ro
    environment:
      - ENVIRONMENT=production
    command: >
      sh -c "
        echo '=== Step 1: Building metadata index ===' &&
        python -m scripts.indexing.index_builder &&
        echo '=== Step 2: Building vector DB ===' &&
        python -m scripts.indexing.build_vector_index &&
        echo '=== Indexing complete ==='
      "
    restart: "no"

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatbot:latest
    env_file: .env
    volumes:
      - chatbot_data:/app/data
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
    # --- UPDATED TO WAIT FOR HEALTHY REDIS ---
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  chatbot_data:
    driver: local